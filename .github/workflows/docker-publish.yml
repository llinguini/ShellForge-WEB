# Build and push the web image to GitHub Container Registry (ghcr.io).
# On each push to main: tags 0.1.N (auto-increment from registry) and latest.
name: Docker publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next 0.1.x version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${{ github.repository_owner }}"
          PKG="${GITHUB_REPOSITORY##*/}"
          PKG="${PKG,,}"

          list_tags() {
            local endpoint owner_type
            owner_type="$(gh api "/users/${OWNER}" --jq .type)"
            if [ "${owner_type}" = "Organization" ]; then
              endpoint="/orgs/${OWNER}/packages/container/${PKG}/versions"
            else
              endpoint="/users/${OWNER}/packages/container/${PKG}/versions"
            fi
            gh api --paginate -H "Accept: application/vnd.github+json" \
              "${endpoint}" \
              --jq '.[].metadata.container.tags[]' 2>/dev/null || true
          }

          TAGS="$(list_tags)"
          LATEST="$(echo "${TAGS}" | grep -E '^0\.1\.[0-9]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 || true)"

          if [ -z "${LATEST}" ]; then
            NEXT="0.1.0"
          else
            PATCH="${LATEST##*.}"
            NEXT="0.1.$((PATCH + 1))"
          fi

          echo "version=${NEXT}" >> "${GITHUB_OUTPUT}"
          echo "Next image version: ${NEXT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.shellforge.dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "| Tag | Image |"
            echo "|-----|-------|"
            echo "| \`${{ steps.version.outputs.version }}\` | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\` |"
            echo "| \`latest\` | \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\` |"
          } >> "${GITHUB_STEP_SUMMARY}"
