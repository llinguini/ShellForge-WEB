services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    env_file:
      - path: .env.local
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
